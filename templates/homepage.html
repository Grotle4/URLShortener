<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorten URL</title>
    <script src="../static/js/api_handler.js" defer></script>
</head>
<body>
    <h1>URL Shortener</h1>
    <h2 name="status_message" id="status_message"> </h2>
    <div>
        <p>Enter your URL to shorten it</p>
        <input type="text" placeholder="URL" name="url" id="url">
        <button onclick="sendEntry()">Submit</button>
    </div>
    <div>
        <p>Enter a short code to retrieve from database</p>
        <input type="text" placeholder="Short Code" name="shortcode" id="retrieve_shortcode">
        <button onclick="getEntry()">Search</button>
    </div>
    <div>
        <p>Enter a short code to update in database</p>
        <input type="text" placeholder="Short Code" name="shortcode" id="update_shortcode">
        <input type="text" placeholder="New URL" name="update_url" id="update_url">
        <button onclick="updateEntry()">Update</button>
    </div>
    <div>
        <p>Enter a short code to delete in database</p>
        <input type="text" placeholder="Short Code" name="shortcode" id="delete_shortcode">
        <button onclick="deleteEntry()">Update</button>
    </div>
    <div>
        <p>Enter a short code to retrieve stats for an entry from database.</p>
        <input type="text" placeholder="Short Code" name="shortcode" id="stats_shortcode">
        <button onclick="getEntryStats()">Search</button>
    </div>
</body>
</html>
